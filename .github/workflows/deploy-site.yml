# Assemble and deploy the aj-demos Pages site: landing + status + each enabled demo's latest release asset
# web-dist.zip (site/projects.json). Triggered manually, by site/ changes, or by a demo repo's release
# workflow (`gh workflow run deploy-site.yml`). No schedules: scheduling lives in the Worker cron.
name: deploy-site
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deploy only when the Cloudflare secrets are set
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set in this repository — skipping the deploy (checks still ran)."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Assemble (fails — keeping the live site — if a demo's release asset is missing)
        if: steps.gate.outputs.deploy == 'true'
        working-directory: site
        run: node scripts/assemble.mjs
      - name: Deploy
        if: steps.gate.outputs.deploy == 'true'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name aj-demos --branch main
