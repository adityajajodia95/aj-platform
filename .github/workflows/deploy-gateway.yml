# Test and deploy aj-gateway when gateway/ changes on main (Platform M8). Gateway secrets (ADMIN_TOKEN,
# GROQ_API_KEY, SESSION_KEY, TURNSTILE_SECRET) live in Cloudflare and are never touched here.
name: deploy-gateway
on:
  push:
    branches: [main]
    paths: ["gateway/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Deploy only when the Cloudflare secrets are set
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set in this repository — skipping the deploy (checks still ran)."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.gate.outputs.deploy == 'true'
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
